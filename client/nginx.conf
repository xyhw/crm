# 全局 API 限流（http 上下文）：每 IP 20 请求/秒，突发队列 40
# （应用层还有登录/接口两道限流，此为边缘兜底）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ── 安全响应头（always 确保错误页也带上）──
    # 注意：location 内一旦出现任何 add_header，会取消 server 级继承，
    # 所以 /assets 里重复声明了一遍
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS：仅在 nginx 直接终结 TLS 时启用；若走 Cloudflare 前置请注释此行（由 CF 统一下发）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文本类资源 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 带内容 hash 的构建产物：一年不可变缓存（文件名变则新 hash，天然失效）
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 管理后台（独立入口 admin.html，勿回退到 index.html）
    location /admin {
        try_files $uri $uri/ /admin.html;
    }

    # SPA history 路由回退（index.html 不设缓存头，随版本更新即时生效）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（边缘限流兜底）
    location /api {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（后端 express.static 托管）
    location /uploads {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
    }
}

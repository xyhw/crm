name: CI

on:
  push:
  pull_request:

jobs:
  lint-server:
    name: Lint (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-server:
    name: Test (server + MySQL 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass_ci
          MYSQL_DATABASE: hotel_order_follow
          MYSQL_USER: hof_user
          MYSQL_PASSWORD: hof_pass_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_USER: hof_user
      DB_PASS: hof_pass_2026
      DB_NAME: hotel_order_follow
      PORT: '3001'
      NODE_ENV: test
      UPLOAD_DIR: /tmp/uploads
      RATE_LIMIT_API_MAX: '999999'
      RATE_LIMIT_LOGIN_MAX: '999999'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start API server
        run: |
          node index.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/health | grep -q '"code":0'; then
              echo "server ready"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3001/api/health || (cat server.log && exit 1)
      - name: Run tests
        run: npm test
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/server.log

  build-client:
    name: Build (client, 冻结维护)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  build-miniapp:
    name: Build (miniapp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:mp

version: "3.8"

services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hof_root_2026}
      MARIADB_DATABASE: ${DB_NAME:-hotel_order_follow}
      MARIADB_USER: ${DB_USER:-hof_user}
      MARIADB_PASSWORD: ${DB_PASS:-hof_pass_2026}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: ${DB_USER:-hof_user}
      DB_PASS: ${DB_PASS:-hof_pass_2026}
      DB_NAME: ${DB_NAME:-hotel_order_follow}
      JWT_SECRET: ${JWT_SECRET:-hotel-order-follow-prod-secret-change-me}
      ADMIN_SECRET: ${ADMIN_SECRET:-admin-prod-secret-change-me}
    volumes:
      - uploads_data:/workspace/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3001"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
